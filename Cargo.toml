[workspace]
resolver = "2"
members = [
  "crates/artifactum-core",
  "crates/artifactum-store",
  "crates/artifactum-resolver",
  "crates/artifactum-plugin-protocol",
  "crates/artifactum-transport-http",
  "crates/artifactum-cli",
  "crates/artifactum-provider-local",
  "crates/artifactum-provider-http",
  "crates/artifactum-provider-github",
  "crates/artifactum-provider-huggingface",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
